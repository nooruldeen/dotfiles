# tmux config, tuned for running Claude Code (and Pi) inside panes.

# --- Claude Code: documented requirements -----------------------------------
# https://code.claude.com/docs/en/terminal-config
#
# Let notifications and the progress bar reach WezTerm instead of tmux
# swallowing the escape sequences.
set -g allow-passthrough on
# Tell Shift+Enter apart from Enter, so the newline shortcut works.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- Terminal behaviour -----------------------------------------------------
set -g default-terminal "tmux-256color"
# WezTerm renders true colour; pass it through.
set -as terminal-features 'xterm*:RGB'
# Esc interrupts Claude Code; do not hold it back waiting for a key sequence.
set -s escape-time 10
# Lets apps (Neovim, agents) know when their pane gains or loses focus.
set -g focus-events on
# Copy to the system clipboard over OSC 52.
set -s set-clipboard on

# --- Usability --------------------------------------------------------------
# Scroll long agent transcripts with the trackpad.
set -g mouse on
set -g history-limit 50000
# Windows and panes number from 1, matching the keyboard.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Ring the bell in the status line when an agent in another window finishes.
set -g monitor-bell on
set -g bell-action other

# Splits and new windows keep the current directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload this file.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
